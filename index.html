<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Special Teacher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      background: #ffffff;
      padding: 6px;
      box-shadow: 0 10px 30px rgba(6, 182, 212, 0.25);
      margin-bottom: 18px;
    }
    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
    }
    .app-title {
      color: #f8fafc;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 20px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo-wrap">
      <img src="icon-192.png" alt="Special Teacher">
    </div>
    <div class="app-title">Special Teacher</div>
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbyw3Dbg81adnjFtM4KCZgvE6LnOY0WjFdsP-j23xCRpXfKvkTbkNNyCoQsEnuNX1UP1fQ/exec" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>

  <script>
    const loader = document.getElementById('loader');
    const frame = document.getElementById('appFrame');

    function hideLoader() {
      setTimeout(() => loader.classList.add('hidden'), 400);
    }

    frame.addEventListener('load', hideLoader);
    setTimeout(hideLoader, 6000);

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
